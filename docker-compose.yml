services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8080:80"
    environment:
      APP_NAME: "S3 Lite"
      APP_URL: "http://localhost:8080"
      APP_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: s3lite
      DB_USERNAME: s3lite
      DB_PASSWORD: s3lite-secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Set these on the first run to install non-interactively.
      ADMIN_NAME: Administrator
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ChangeMe123
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root-secret
      MARIADB_DATABASE: s3lite
      MARIADB_USER: s3lite
      MARIADB_PASSWORD: s3lite-secret
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    restart: unless-stopped

  # Optional SFTP front end, off by default. Start it with:
  #     docker compose --profile sftp up -d
  #
  # It has to be opt-in because atmoz/sftp exits when it is given no accounts,
  # and an always-on service with none would restart forever.
  #
  # Accounts are `user:password[:e][:uid[:gid]]`, space separated. Override
  # them — the default below is a placeholder, not a usable password:
  #     SFTP_USERS="alice:s3cret:1001 bob:hunter2:1002" docker compose --profile sftp up -d
  sftp:
    image: atmoz/sftp:alpine
    profiles: ["sftp"]
    command: ${SFTP_USERS:-s3lite:changeme:1001}
    ports:
      - "2222:22"
    volumes:
      # /home must line up with storage/sftp, because that is where the
      # `sftp.sync` job looks for each account's uploads. Mounting the whole
      # storage volume here would put them in storage/<user> instead, where
      # nothing would ever index them.
      - type: volume
        source: storage
        target: /home
        volume:
          subpath: sftp
    restart: unless-stopped

volumes:
  storage:
  db:
  redis:
